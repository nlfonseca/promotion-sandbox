# Keeps master ⊂ beta ⊂ develop after a hotfix. Whenever a branch has commits the
# next one lacks (master → beta, beta → develop), it builds a `backflow/*` branch
# on top of the lagging branch and opens its PR:
#   - lagging branch has nothing of its own → the branch is just the hotfix commit
#   - otherwise → a real merge commit whose first parent is the lagging branch
# Either way the PR lands like every other promotion: approve + `promote` label,
# fast-forward. No merge button, so it also works where merge commits are disabled.
# Cherry-picks would not restore sync: the copied commit has a different hash.
name: hotfix-backflow

on:
  push:
    branches: [master, beta, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotfix-backflow
  cancel-in-progress: false

jobs:
  backflow:
    runs-on: ubuntu-latest
    steps:
      - name: Mint promotion token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Build backflow branches and open their PRs
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}
        run: .github/scripts/build-backflow.sh master:beta beta:develop
