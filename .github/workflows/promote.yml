# The fast-forward executor. Runs when a promotion PR gets the `promote` label
# or an approving review, checks the guards, waits for green checks, then
# fast-forwards the base branch to the PR head. Never rebases, squashes or
# merges: if a fast-forward is impossible it fails and says why.
#
# Runs on pull_request_target so it has the repo's secrets. It never checks
# out or executes PR code: it only moves a branch pointer to a commit that
# already exists in this repository (forks are refused).
name: promote

on:
  pull_request_target:
    types: [labeled]
    branches: [beta, master]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the promotion PR to fast-forward
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-${{ github.event.pull_request.base.ref || 'manual' }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'promote') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        && contains(fromJSON('["beta","master"]'), github.event.pull_request.base.ref))
    runs-on: ubuntu-latest
    steps:
      # Short-lived GitHub App installation token; the App is the only identity
      # allowed to push to beta/master (ruleset bypass actor). Never GITHUB_TOKEN.
      - name: Mint promotion token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

      - name: Check guards
        id: guard
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
            --json number,state,isCrossRepository,baseRefName,headRefName,headRefOid,labels,reviewDecision > pr.json
          base=$(jq -r .baseRefName pr.json)
          head=$(jq -r .headRefName pr.json)
          sha=$(jq -r .headRefOid pr.json)
          state=$(jq -r .state pr.json)
          cross=$(jq -r .isCrossRepository pr.json)
          decision=$(jq -r .reviewDecision pr.json)
          labelled=$(jq -r '[.labels[].name] | index("promote") != null' pr.json)
          echo "PR #$PR_NUMBER: $head ($sha) → $base | state=$state promote-label=$labelled review=$decision"

          skip() { echo "::notice::$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$state" = OPEN ] || skip "PR is $state, nothing to do."
          case "$base" in beta|master) ;; *) skip "$base is not a promotion branch." ;; esac
          if [ "$cross" != false ]; then echo "::error::Refusing to promote from a fork."; exit 1; fi
          [ "$labelled" = true ] || skip "Waiting for the 'promote' label."
          [ "$decision" = APPROVED ] || skip "Waiting for a code-owner approval (review decision: $decision)."

          {
            echo "go=true"
            echo "base=$base"
            echo "head=$head"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for checks on the head commit
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: |
          sleep 20   # let checks triggered by the same event get queued
          deadline=$((SECONDS + 900))
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "promote") | {name, status, conclusion}]' > checks.json
            pending=$(jq '[.[] | select(.status != "completed")] | length' checks.json)
            if [ "$pending" != 0 ]; then
              [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Timed out waiting for checks."; exit 1; }
              echo "Waiting for $pending check(s)…"; sleep 15; continue
            fi
            failed=$(jq -r '[.[] | select(.conclusion | IN("success","neutral","skipped") | not) | .name] | join(", ")' checks.json)
            if [ -n "$failed" ]; then
              echo "::error::Checks not green on $SHA: $failed"; exit 1
            fi
            jq -r '.[] | "✓ \(.name): \(.conclusion)"' checks.json
            break
          done

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
        with:
          ref: ${{ steps.guard.outputs.base }}
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Fast-forward
        id: ff
        if: steps.guard.outputs.go == 'true'
        env:
          BASE_BRANCH: ${{ steps.guard.outputs.base }}
          HEAD_BRANCH: ${{ steps.guard.outputs.head }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: |
          git fetch origin "$HEAD_BRANCH"
          git merge --ff-only "$SHA"
          echo "$BASE_BRANCH → $(git rev-parse HEAD)"

      - name: Push
        id: push
        if: steps.guard.outputs.go == 'true'
        env:
          BASE_BRANCH: ${{ steps.guard.outputs.base }}
        run: git push origin "HEAD:refs/heads/$BASE_BRANCH"

      - name: Report on the PR
        if: always() && steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BASE_BRANCH: ${{ steps.guard.outputs.base }}
          HEAD_BRANCH: ${{ steps.guard.outputs.head }}
          SHA: ${{ steps.guard.outputs.sha }}
          FF: ${{ steps.ff.outcome }}
          PUSH: ${{ steps.push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PUSH" = success ]; then
            gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
              --body "✅ Fast-forwarded \`$BASE_BRANCH\` to $SHA (\`$HEAD_BRANCH\`). [Run]($RUN_URL)"
            exit 0
          fi
          # Drop the label so promotion-gate goes red again and the merge button stays blocked.
          gh pr edit "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --remove-label promote || true
          if [ "$FF" = failure ]; then
            msg="❌ Cannot fast-forward \`$BASE_BRANCH\` to \`$HEAD_BRANCH\`: \`$BASE_BRANCH\` has commits that \`$HEAD_BRANCH\` does not, so something landed directly on \`$BASE_BRANCH\`. Flow it back first with merge PRs (\`master → beta → develop\`, see README → Hotfixes), then re-add the \`promote\` label."
          elif [ "$PUSH" = failure ]; then
            msg="❌ Fast-forward computed but the push to \`$BASE_BRANCH\` was rejected. Check that the GitHub App is the bypass actor on the \`promotion-branches\` ruleset and that required checks are green on $SHA. Re-add the \`promote\` label to retry."
          else
            msg="❌ Promotion did not complete (checks not green, or timed out). Re-add the \`promote\` label to retry."
          fi
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$msg [Run]($RUN_URL)"
