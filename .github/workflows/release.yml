# Tags and publishes a GitHub Release every time master moves. The version bump
# comes from Conventional Commits since the previous tag:
#   feat!: / BREAKING CHANGE → major, feat: → minor, everything else → patch
# (highest wins). Notes live on the Release, not in a CHANGELOG file, so no
# bookkeeping commits ever land on develop.
name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version and notes
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          mapfile -t shas < <(git rev-list --no-merges "$range")
          if [ "${#shas[@]}" -eq 0 ]; then
            echo "No new commits since ${last:-the beginning}: nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump=patch; breaking=""; features=""; fixes=""; others=""
          for sha in "${shas[@]}"; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%b "$sha")
            line="- $subject ($(git rev-parse --short "$sha"))"
            type=$(printf '%s\n' "$subject" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p')
            if printf '%s\n' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || printf '%s\n' "$body" | grep -q 'BREAKING CHANGE'; then
              bump=major; breaking+="$line"$'\n'; continue
            fi
            case "$type" in
              feat) [ "$bump" = major ] || bump=minor; features+="$line"$'\n' ;;
              fix)  fixes+="$line"$'\n' ;;
              *)    others+="$line"$'\n' ;;
            esac
          done

          IFS=. read -r major minor patch <<< "${last#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v$major.$minor.$patch"

          {
            if [ -n "$breaking" ]; then printf '### ⚠️ Breaking changes\n%s\n' "$breaking"; fi
            if [ -n "$features" ]; then printf '### Features\n%s\n' "$features"; fi
            if [ -n "$fixes" ];    then printf '### Fixes\n%s\n' "$fixes"; fi
            if [ -n "$others" ];   then printf '### Other\n%s\n' "$others"; fi
            if [ -n "$last" ]; then
              printf '**Full changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$last" "$version"
            fi
          } > notes.md

          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "## $version ($bump bump from ${last:-nothing})"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "Releasing $version ($bump bump from ${last:-nothing})"; cat notes.md

      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret PROMOTE_TOKEN is not set (see README → Setup)."
            exit 1
          fi
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file notes.md
